name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak proyek
        run: |
          mkdir work
          unzip -q Sketch-project.zip -d work

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: cd work && gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AutoSketch-debug-apk
          path: work/app/build/outputs/apk/debug/app-debug.apk
